name: Build and audit compatibility service

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler
        run: swift --version
      - name: Run daemon, lease, recovery & auth tests
        run: swift test
      - name: Build Universal compatibility bundle
        run: zsh scripts/build-compatibility.sh
      - name: Verify bundle structure, entitlements & parser self-test
        run: python3 scripts/verify-compatibility.py "dist/LidLid Compatibility.app"
